# ==========================================================
# Parallels SQL Admins
# Конфигурация
# ==========================================================

[mysql]

user = koshkin
password =

port = 3306

connect_timeout = 5
read_timeout = 60
write_timeout = 60

retry = 3

# Сколько простаивающих соединений может держать один поток
pool_idle = 4

# Глобальный лимит простаивающих соединений (все потоки вместе).
# idle-кэш не может превысить это значение суммарно.
max_idle_connections = 16

# Секунды простоя, после которых закэшированное соединение закрывается
# (0 = отключено)
idle_timeout = 60

# Глобальный лимит одновременных соединений (защита от Too many connections)
max_connections = 100

# Максимум одновременных соединений к одной паре host + database
max_per_key = 4

# Секунды ожидания свободного соединения в пуле (0 = ждать бесконечно)
acquire_timeout = 10

[mssql]

user = sa
password =

port = 1433

connect_timeout = 5
retry = 3

# Сколько простаивающих соединений может держать один поток
pool_idle = 4

# Секунды простоя, после которых закэшированное соединение закрывается
idle_timeout = 60

# Глобальный лимит простаивающих соединений (все потоки вместе)
max_idle_connections = 16

# Глобальный лимит одновременных соединений (защита от перегрузки)
max_connections = 100

# Максимум одновременных соединений к одной паре host + database
max_per_key = 4

# Секунды ожидания свободного соединения в пуле (0 = ждать бесконечно)
acquire_timeout = 10

[postgresql]

user = postgres
password =

port = 5432

connect_timeout = 5
retry = 3

# Сколько простаивающих соединений может держать один поток
pool_idle = 4

# Секунды простоя, после которых закэшированное соединение закрывается
idle_timeout = 60

# Глобальный лимит простаивающих соединений (все потоки вместе)
max_idle_connections = 16

# Глобальный лимит одновременных соединений (защита от перегрузки)
max_connections = 100

# Максимум одновременных соединений к одной паре host + database
max_per_key = 4

# Секунды ожидания свободного соединения в пуле (0 = ждать бесконечно)
acquire_timeout = 10

[sqlite]

connect_timeout = 5
retry = 3
pool_idle = 4
idle_timeout = 60
max_idle_connections = 16
max_connections = 100
max_per_key = 4
acquire_timeout = 10

[parallel]

workers = 8
database_workers = 4
search_workers = 4

[sizes]

# Мягкий лимит одновременных соединений для подсчёта размеров БД/таблиц
# (поверх глобального пула; не даёт размернику «съесть» все слоты)
max_connections = 4

# Параллельность запроса таблиц одной MSSQL-базы (ключ пула (host, None))
table_workers = 4

# Секунды жизни кэша каталога сервера; в пределах TTL refresh_sizes()
# и раскрытие сервера не обращаются к БД (0 = кэш выключен)
catalog_ttl = 300

[filter]

country = russia
country_setting = csSystemCountry
target_setting = banEmailDomain
target_value = gmail.com, icloud.com, hotmail.com, outlook.com, yahoo.com, mail.com, proton.me, aol.com, gmx.com, zoho.com
database_prefix = ar_
exclude_database_regex = (_upd$|_test$|_demo$|_v\d+$)

[logging]

directory = logs
csv = result.csv
errors = errors.log
run = run.log
actions = actions
max_bytes = 5000000
backups = 3
retention_days = 30
verbose = true

[output]

color = true
progress = true
eta = true
speed = true
summary = true

[advanced]

ignore_databases =
    information_schema,
    performance_schema,
    mysql,
    sys

settings_table = cfg_settings
batch_size = 100
export_csv = true
export_errors = true
servers_file = servers.json

[security]

# Тип ключа шифрования выбирается в настройках приложения (раздел
# «Конфиденциальность»): "master_password" (персональный мастер-пароль)
# или "file_key" (ключ в файле servers.key). Здесь конфигурируются только
# параметры KDF.

# Количество итераций PBKDF2-HMAC-SHA256 для вывода ключа из мастер-пароля
kdf_iterations = 600000

# Количество резервных копий servers.json для ротации
backup_count = 5
[updates]

# Автопроверка обновлений (GitHub Releases): уведомление при запуске
# приложения и раз в сутки. «Обновить сейчас» скачивает и запускает
# Setup.exe (Windows) или открывает страницу релиза (Linux/macOS).
enabled = true
