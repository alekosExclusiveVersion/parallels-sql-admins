name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ParallelsSQLAdmin-windows
            ext: zip
          - os: ubuntu-latest
            artifact: ParallelsSQLAdmin-linux
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 \
            libxcb-render-util0 libdbus-1-3 libxcomposite1 libxdamage1 \
            libxrandr2 libxi6 libxtst6

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -q

      - name: Build
        run: pyinstaller "Parallels SQL Admin.spec" --noconfirm

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Parallels SQL Admin/Parallels SQL Admin.exe')) {
            Write-Error 'Parallels SQL Admin.exe not found in dist'
            exit 1
          }
          Get-ChildItem 'dist/Parallels SQL Admin' | Select-Object Name

      - name: Verify build output (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x "dist/Parallels SQL Admin/Parallels SQL Admin" \
            || { echo "binary not found in dist" >&2; exit 1; }
          ls -la "dist/Parallels SQL Admin"

      - name: Sign executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PFX_PASSWORD: ${{ secrets.CERT_PFX_PASSWORD }}
        run: pwsh scripts/sign-windows.ps1 -Path 'dist/Parallels SQL Admin/Parallels SQL Admin.exe'

      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP_VERSION=$(python -c "from common.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$APP_VERSION" >> "$GITHUB_ENV"
          APP="$PWD/dist/Parallels SQL Admin/Parallels SQL Admin"
          "$APP" &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: app alive after 8s"
            kill "$PID"
          else
            echo "ERROR: app exited early"
            if [ -n "$APPDATA" ] && [ -f "$APPDATA/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Windows) ---"
              cat "$APPDATA/Parallels SQL Admin/crash.log"
            fi
            if [ -n "$XDG_CONFIG_HOME" ] && [ -f "$XDG_CONFIG_HOME/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Linux, XDG) ---"
              cat "$XDG_CONFIG_HOME/Parallels SQL Admin/crash.log"
            fi
            if [ -f "$HOME/.config/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Linux, HOME) ---"
              cat "$HOME/.config/Parallels SQL Admin/crash.log"
            fi
            exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist/Parallels SQL Admin' `
            -DestinationPath 'release/${{ matrix.artifact }}.${{ matrix.ext }}'

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/${{ matrix.artifact }}.${{ matrix.ext }}" \
            "Parallels SQL Admin"

      - name: Verify archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar -tf 'release/ParallelsSQLAdmin-windows.zip' > zip_list.txt
          Get-Content zip_list.txt
          if (-not (Select-String -Path zip_list.txt -Pattern 'Parallels SQL Admin\.exe' -Quiet)) {
            Write-Error 'Parallels SQL Admin.exe not found in archive'
            exit 1
          }

      - name: Verify archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -tzf "release/ParallelsSQLAdmin-linux.tar.gz" > tar_list.txt
          cat tar_list.txt
          if ! grep -q 'Parallels SQL Admin/Parallels SQL Admin$' tar_list.txt; then
            echo "binary not found in archive" >&2
            exit 1
          fi

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC not found: $iscc"
            exit 1
          }
          & $iscc installer\setup.iss /DAppVersion=${{ env.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item 'release\ParallelsSQLAdmin-Setup-${{ env.version }}.exe' |
            Select-Object FullName, Length

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PFX_PASSWORD: ${{ secrets.CERT_PFX_PASSWORD }}
        run: pwsh scripts/sign-windows.ps1 -Path 'release/ParallelsSQLAdmin-Setup-${{ env.version }}.exe'

      - name: Verify installer signed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature 'release/ParallelsSQLAdmin-Setup-${{ env.version }}.exe'
          if ($null -eq $sig.SignerCertificate) {
            Write-Error 'Setup.exe has no signature'
            exit 1
          }
          Write-Host "Setup.exe signed: $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ParallelsSQLAdmin-Setup-${{ env.version }}
          path: release/ParallelsSQLAdmin-Setup-${{ env.version }}.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: release/ParallelsSQLAdmin-Setup-${{ env.version }}.exe
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-v${{ env.version }}
          path: release/${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/${{ matrix.artifact }}.${{ matrix.ext }}
          fail_on_unmatched_files: true

  build-macos:
    name: Build (macOS, DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -q

      - name: Detect Apple secrets
        run: |
          HAS_SIGN=0
          HAS_NOTARY=0
          if [ -n "${{ secrets.APPLE_CERT_P12_B64 }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            HAS_SIGN=1
          fi
          if [ "$HAS_SIGN" = "1" ]; then
            if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
              HAS_NOTARY=1
            fi
            if [ -n "${{ secrets.APPLE_API_KEY_ID }}" ] && [ -n "${{ secrets.APPLE_API_ISSUER }}" ] && [ -n "${{ secrets.APPLE_API_KEY_B64 }}" ]; then
              HAS_NOTARY=1
            fi
          fi
          echo "HAS_SIGN=$HAS_SIGN" >> "$GITHUB_ENV"
          echo "HAS_NOTARY=$HAS_NOTARY" >> "$GITHUB_ENV"
          if [ "$HAS_NOTARY" = "1" ]; then
            echo "Apple secrets: full set (sign + notarize)"
          elif [ "$HAS_SIGN" = "1" ]; then
            echo "Apple secrets: sign only, notarization skipped (see docs/macos-signing.md)"
          else
            echo "Apple secrets: none, ad-hoc unsigned build (see docs/macos-signing.md)"
          fi

      - name: Refuse unsigned release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_NOTARY != '1'
        run: |
          echo "ERROR: tag build requires full Apple secrets (sign + notarize), release must never ship unsigned (see docs/macos-signing.md)" >&2
          exit 1

      - name: Import Developer ID certificate
        if: env.HAS_SIGN == '1'
        env:
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          P12="$RUNNER_TEMP/apple-cert.p12"
          echo "$APPLE_CERT_P12_B64" | base64 -d > "$P12"
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPWD="$(openssl rand -base64 24)"
          echo "$KCPWD" > "$RUNNER_TEMP/kc.pwd"
          security create-keychain -p "$KCPWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPWD" "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPWD" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$P12"

      - name: Build DMG (sign + notarize)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGN_IDENTITY: Developer ID Application
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          EXTRA=""
          if [ "${HAS_NOTARY:-0}" != "1" ]; then
            EXTRA="--skip-notarize"
          fi
          # shellcheck disable=SC2086
          bash scripts/build-macos-dmg.sh $EXTRA
          APP_VERSION=$(python -c "from common.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Verify DMG
        run: |
          if [ "${{ env.HAS_NOTARY }}" = "1" ]; then
            bash scripts/verify-macos-dmg.sh "release/ParallelsSQLAdmin-macos-${{ env.version }}.dmg" --expect-signed
          else
            bash scripts/verify-macos-dmg.sh "release/ParallelsSQLAdmin-macos-${{ env.version }}.dmg"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ParallelsSQLAdmin-macos-v${{ env.version }}
          path: release/ParallelsSQLAdmin-macos-${{ env.version }}.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_NOTARY == '1'
        uses: softprops/action-gh-release@v3
        with:
          files: release/ParallelsSQLAdmin-macos-${{ env.version }}.dmg
          fail_on_unmatched_files: true
