name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ParallelsSQLAdmin-windows
            ext: zip
          - os: ubuntu-latest
            artifact: ParallelsSQLAdmin-linux
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 \
            libxcb-render-util0 libdbus-1-3 libxcomposite1 libxdamage1 \
            libxrandr2 libxi6 libxtst6

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller "Parallels SQL Admin.spec" --noconfirm

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Parallels SQL Admin/Parallels SQL Admin.exe')) {
            Write-Error 'Parallels SQL Admin.exe not found in dist'
            exit 1
          }
          Get-ChildItem 'dist/Parallels SQL Admin' | Select-Object Name

      - name: Verify build output (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x "dist/Parallels SQL Admin/Parallels SQL Admin" \
            || { echo "binary not found in dist" >&2; exit 1; }
          ls -la "dist/Parallels SQL Admin"

      - name: Sign executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PFX_B64: ${{ secrets.CERT_PFX_B64 }}
          CERT_PFX_PASSWORD: ${{ secrets.CERT_PFX_PASSWORD }}
        run: |
          Write-Host 'Sign step: start'
          if ([string]::IsNullOrEmpty($env:CERT_PFX_B64)) {
            Write-Host 'CERT_PFX_B64 not set — build stays unsigned'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_B64))
          Write-Host "Sign step: pfx written ($((Get-Item $pfx).Length) bytes)"

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfx, $env:CERT_PFX_PASSWORD, $flags)
          Write-Host "Sign step: cert loaded ($($cert.Subject))"

          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $kit.FullName 'x64\signtool.exe'
          if (-not (Test-Path $signtool)) {
            Write-Error "signtool not found: $signtool"
            exit 1
          }
          Write-Host "Sign step: signtool = $signtool"

          $exe = 'dist/Parallels SQL Admin/Parallels SQL Admin.exe'

          $sigArgs = @(
            'sign', '/f', $pfx, '/p', $env:CERT_PFX_PASSWORD,
            '/fd', 'SHA256', '/tr', 'http://timestamp.digicert.com',
            '/td', 'SHA256', '/v', $exe
          )
          Write-Host 'Sign step: signing...'
          & $signtool @sigArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Sign step: signed'

          $sig = Get-AuthenticodeSignature $exe
          if ($null -eq $sig.SignerCertificate) {
            Write-Error "No signer: $($sig.Status) ($($sig.StatusMessage))"
            exit 1
          }
          if ($sig.Status -notin @('Valid', 'NotTrusted')) {
            Write-Error "Signature status: $($sig.Status) ($($sig.StatusMessage))"
            exit 1
          }
          $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
          $chain.ChainPolicy.ExtraStore.Add($cert)
          $chain.ChainPolicy.VerificationFlags = [System.Security.Cryptography.X509Certificates.X509VerificationFlags]::AllowUnknownCertificateAuthority
          $chain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
          if (-not $chain.Build($sig.SignerCertificate)) {
            Write-Error ("Chain validation failed: " + (($chain.ChainStatus | ForEach-Object { $_.Status }) -join ', '))
            exit 1
          }
          Write-Host "Signed OK: $($sig.SignerCertificate.Subject)"

      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP_VERSION=$(python -c "from common.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$APP_VERSION" >> "$GITHUB_ENV"
          APP="$PWD/dist/Parallels SQL Admin/Parallels SQL Admin"
          "$APP" &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: app alive after 8s"
            kill "$PID"
          else
            echo "ERROR: app exited early"
            if [ -n "$APPDATA" ] && [ -f "$APPDATA/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Windows) ---"
              cat "$APPDATA/Parallels SQL Admin/crash.log"
            fi
            if [ -n "$XDG_CONFIG_HOME" ] && [ -f "$XDG_CONFIG_HOME/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Linux, XDG) ---"
              cat "$XDG_CONFIG_HOME/Parallels SQL Admin/crash.log"
            fi
            if [ -f "$HOME/.config/Parallels SQL Admin/crash.log" ]; then
              echo "--- crash.log (Linux, HOME) ---"
              cat "$HOME/.config/Parallels SQL Admin/crash.log"
            fi
            exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist/Parallels SQL Admin' `
            -DestinationPath 'release/${{ matrix.artifact }}.${{ matrix.ext }}'

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/${{ matrix.artifact }}.${{ matrix.ext }}" \
            "Parallels SQL Admin"

      - name: Verify archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tar -tf 'release/ParallelsSQLAdmin-windows.zip' > zip_list.txt
          Get-Content zip_list.txt
          if (-not (Select-String -Path zip_list.txt -Pattern 'Parallels SQL Admin\.exe' -Quiet)) {
            Write-Error 'Parallels SQL Admin.exe not found in archive'
            exit 1
          }

      - name: Verify archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -tzf "release/ParallelsSQLAdmin-linux.tar.gz" > tar_list.txt
          cat tar_list.txt
          if ! grep -q 'Parallels SQL Admin/Parallels SQL Admin$' tar_list.txt; then
            echo "binary not found in archive" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ env.version }}
          path: release/${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact }}.${{ matrix.ext }}
          fail_on_unmatched_files: true
