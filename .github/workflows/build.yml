name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ParallelsSQLAdmin-windows
            ext: zip
          - os: ubuntu-latest
            artifact: ParallelsSQLAdmin-linux
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 \
            libxcb-render-util0 libdbus-1-3 libxcomposite1 libxdamage1 \
            libxrandr2 libxi6 libxtst6

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller "Parallels SQL Admin.spec" --noconfirm

      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP_VERSION=$(python -c "from common.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$APP_VERSION" >> "$GITHUB_ENV"
          APP="$PWD/dist/Parallels SQL Admin/Parallels SQL Admin"
          "$APP" &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK: app alive after 8s"
            kill "$PID"
          else
            echo "ERROR: app exited early"
            exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path 'dist/Parallels SQL Admin' `
            -DestinationPath 'release/${{ matrix.artifact }}.${{ matrix.ext }}'

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/${{ matrix.artifact }}.${{ matrix.ext }}" \
            "Parallels SQL Admin"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ env.version }}
          path: release/${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact }}.${{ matrix.ext }}
          fail_on_unmatched_files: true
